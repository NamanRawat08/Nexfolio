<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexfolio — a stock trading simulation dashboard using sample data. No real money, no brokerage." />
    <meta name="theme-color" content="#120d0a" />
    <script>
      // Apply the saved theme before the app loads, so there is no flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('nexfolio_theme');
          var light =
            pref === 'light' ||
            ((pref === null || pref === 'system') && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexfolio — Trading Simulation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
